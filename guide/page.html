<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Joy Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <!-- index -->
    <main class="reader"><!-- topics --></main>
  </div>
  <script>
    // The guide's few interactions. The index and the topics are in the
    // page already, and the stylesheet shows the topic the address names,
    // so the guide reads without this script.
    const shell = document.querySelector('.shell');
    const menu = document.querySelector('.bar button');
    const filter = document.getElementById('filter');
    const empty = document.querySelector('.toc-empty');
    const topics = [...document.querySelectorAll('.topic')];
    const links = [...document.querySelectorAll('.toc a')];
    const parts = [...document.querySelectorAll('.toc-part')];

    // The topic the address names, or the first one.
    const current = () => topics.find((topic) => topic.id === location.hash.slice(1)) ?? topics[0];

    const closeMenu = () => {
      shell.classList.remove('menu-open');
      menu.setAttribute('aria-expanded', 'false');
    };

    // The topic on screen: marked in the index and named in the tab.
    const mark = () => {
      const topic = current();
      for (const link of links) {
        if (link.hash === '#' + topic.id) {
          link.setAttribute('aria-current', 'page');
          document.title = link.lastChild.textContent + ' · Joy Guide';
        } else {
          link.removeAttribute('aria-current');
        }
      }
    };
    mark();

    // Another topic, from a link, the arrows or Back and Forward: read from
    // the top, with the phone's index closed.
    addEventListener('hashchange', () => {
      mark();
      closeMenu();
      scrollTo(0, 0);
    });

    // Finding a topic by a word, and Enter to open the first one found.
    filter.addEventListener('input', () => {
      const words = filter.value.trim().toLowerCase();
      for (const link of links) link.hidden = !link.dataset.words.includes(words);
      for (const part of parts) part.hidden = !part.querySelector('a:not([hidden])');
      empty.hidden = links.some((link) => !link.hidden);
    });
    filter.addEventListener('keydown', (event) => {
      const first = links.find((link) => !link.hidden);
      if (event.key === 'Enter' && first) location.hash = first.hash;
    });

    // The phone's index.
    menu.addEventListener('click', () => {
      const open = shell.classList.toggle('menu-open');
      menu.setAttribute('aria-expanded', String(open));
    });

    // The left and right arrows page through the topics, except in the
    // search box, where they move the caret.
    addEventListener('keydown', (event) => {
      if (event.target.closest?.('input, textarea') || event.ctrlKey || event.altKey || event.metaKey) return;
      const step = { ArrowLeft: -1, ArrowRight: 1 }[event.key];
      const next = step && topics[topics.indexOf(current()) + step];
      if (next) location.hash = next.id;
    });

    // A code block's Copy button copies its code, and says how that went.
    addEventListener('click', async (event) => {
      const button = event.target.closest?.('.copy');
      if (!button) return;
      try {
        await navigator.clipboard.writeText(button.closest('.code').querySelector('code').textContent);
        button.textContent = 'Copied';
      } catch {
        button.textContent = 'Not copied';
      }
      clearTimeout(button.reset);
      button.reset = setTimeout(() => { button.textContent = 'Copy'; }, 1500);
    });
  </script>
</body>
</html>
