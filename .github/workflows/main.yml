name: Main

# Every push to main. This is the only workflow that deliberately builds roc
# from source to warm the binary cache, then runs the same suite a PR runs.
# The other workflows expect cache hits (a cold cache still makes any of
# them build from source, the setup action warns when that happens). Slow
# right after the roc-src pin moves, then a cache hit until it moves again.

on:
  push:
    branches: [main]
  # Rebuild and re-push without waiting for a commit, e.g. after the cache
  # has been pruned.
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Build and cache the compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A cold cache on one system must not stop the other from being filled.
      fail-fast: false
      matrix:
        # One push per system, since Nix cannot cross-compile to Darwin.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            substituters = https://cache.nixos.org https://niclas-ahden.cachix.org
            trusted-substituters = https://cache.nixos.org https://niclas-ahden.cachix.org
            accept-flake-config = true
            extra-trusted-public-keys = niclas-ahden.cachix.org-1:FdGli1vBk0cTuVJV27Tau/JvlbW+Ly3pRwFByyqdke0=

      # The write token. It lives here instead of in tests.yml so that fork
      # PRs never need a secret.
      - uses: cachix/cachix-action@v15
        with:
          name: niclas-ahden
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # No --max-jobs 0 here: building on a miss is the point. cachix-action
      # pushes whatever this produces.
      - name: Build the pinned Roc compiler
        run: nix build .#roc --no-link --print-out-paths

      # Push the whole devShell closure too, or `nix develop` still compiles
      # playwright, rust and friends on a cold cache.
      - name: Build and cache the devShell
        run: |
          nix develop --profile .cachix-profile --command true
          cachix push niclas-ahden .cachix-profile

  # The same legs a pull request had to pass, re-run on the merge result.
  required:
    needs: warm
    # Warming is an optimization. A failed push just means a slower suite.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Pinned
      opts: '["speed"]'
      extras: true
      e2e: all

  # Informational, see tests.yml. A red leg here reddens the run but gates
  # nothing.
  advisory:
    needs: warm
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["pinned"]'
      label: Advisory
      opts: '["dev", "size"]'
      e2e: all

  # The nightly the README recommends, as on a pull request (see tests.yml):
  # the no-Nix route, which is also the Windows one. Speed blocks, the other
  # opt levels inform.
  readme-nightly:
    name: Resolve the nightly named in the README
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.readme.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: readme
        run: |
          set -euo pipefail
          tag=$(sed -n 's|.*/roc-lang/nightlies/releases/tag/\(nightly-[^)]*\)).*|\1|p' README.md | head -1)
          [ -n "$tag" ] || { echo "error: no roc nightly link in README.md" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "README names $tag"

  nightly:
    needs: readme-nightly
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.readme-nightly.outputs.tag }}"]'
      label: README nightly
      opts: '["speed"]'
      e2e: all

  nightly-opts:
    needs: readme-nightly
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.readme-nightly.outputs.tag }}"]'
      label: README nightly
      opts: '["dev", "size"]'
      e2e: all
