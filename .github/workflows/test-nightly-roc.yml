name: Test latest Joy release on latest nightly Roc

# Every morning, test the latest published Joy bundle, by its real URL, on
# the newest Roc nightly. Green moves the recommendation forward wherever
# a nightly is named (this repo and the published joy-todomvc starter) and
# in that release's notes. Red means we adapt to Roc or report a bug.
#
# Speed gates the recommendation, on every system and in every browser. Dev
# and size run beside it and must not hold a recommendation back.
# Publishing does not trigger this. The release workflow already tested that
# bundle as a draft.

on:
  schedule:
    # Nightlies publish between 10:00 and 13:30 UTC.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Queue instead of cancel. The run ends by pushing the new nightly and editing
# the release notes, and a cancel between the two leaves them disagreeing.
concurrency:
  group: nightly-roc
  cancel-in-progress: false

jobs:
  # Resolve the versions once, so every test leg runs the exact same nightly
  # against the exact same Joy release.
  resolve:
    name: Resolve the latest nightly and the latest Joy release
    runs-on: ubuntu-24.04
    outputs:
      nightly: ${{ steps.versions.outputs.nightly }}
      sha: ${{ steps.versions.outputs.sha }}
      prev_sha: ${{ steps.versions.outputs.prev_sha }}
      joy: ${{ steps.versions.outputs.joy }}
      bundle: ${{ steps.versions.outputs.bundle }}
    steps:
      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(gh release view --repo roc-lang/nightlies --json tagName -q .tagName)
          # Tag spellings have changed before, but both end in the short sha
          prev=$(gh release list --repo roc-lang/nightlies --limit 2 --json tagName -q '.[1].tagName')

          joy_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          bundle=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets \
                     -q '.assets[] | select(.name | endswith(".tar.zst")) | .url')

          [ -n "$tag" ] || { echo "error: could not resolve the latest roc nightly" >&2; exit 1; }
          [ -n "$bundle" ] || { echo "error: no platform bundle on Joy $joy_tag" >&2; exit 1; }

          {
            echo "nightly=$tag"
            echo "sha=${tag##*-}"
            echo "prev_sha=${prev##*-}"
            echo "joy=$joy_tag"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"

          echo "Roc $tag against Joy $joy_tag"
          echo "Testing Joy **$joy_tag** against Roc **$tag**" >> "$GITHUB_STEP_SUMMARY"

  # Versions go in the job name: `run-name` cannot see `needs`.
  test:
    needs: resolve
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve.outputs.nightly }}"]'
      label: Joy ${{ needs.resolve.outputs.joy }} on ${{ needs.resolve.outputs.nightly }}
      opts: '["speed"]'
      ref: ${{ needs.resolve.outputs.joy }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}
      e2e: all

  # Informational: not in update-recommendation's needs.
  test-opts:
    needs: resolve
    uses: ./.github/workflows/suite.yml
    with:
      roc: '["${{ needs.resolve.outputs.nightly }}"]'
      label: Joy ${{ needs.resolve.outputs.joy }} on ${{ needs.resolve.outputs.nightly }}
      opts: '["dev", "size"]'
      ref: ${{ needs.resolve.outputs.joy }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}
      e2e: all

  # Green on every leg: recommend this nightly wherever one is named (this
  # repo, and the TodoMVC starter as published) and in the tested release's
  # notes (bundle users).
  update-recommendation:
    name: Name ${{ needs.resolve.outputs.nightly }} in the repo, the starter and the release notes
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Name this nightly everywhere in the repo
        env:
          NIGHTLY: ${{ needs.resolve.outputs.nightly }}
        run: |
          set -euo pipefail

          # Every nightly tag in a tracked file is the recommended one: the
          # READMEs, the starters, a Dockerfile's ROC_NIGHTLY, anything added
          # later. So a new reference needs no change here, as long as it
          # spells out the whole tag (nightly-2026-08-26-b29bef3, never just
          # the date and the sha).
          #
          # .github/ is left out: its tags are examples in input docs, and a
          # push made with GITHUB_TOKEN may not change workflow files.
          pattern='nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}'
          echo "$NIGHTLY" | grep -qxE "$pattern" || {
            echo "error: $NIGHTLY does not look like a nightly tag, so it replaces nothing" >&2
            exit 1
          }

          files=$(git grep -lE "$pattern" -- . ':!.github' || true)
          [ -n "$files" ] || {
            echo "error: no tracked file names a roc nightly, so nothing recommends one" >&2
            exit 1
          }

          # Replace every tag wherever it appears, so a link's text and its
          # URL move together and the wording around them survives.
          git grep -lzE "$pattern" -- . ':!.github' | xargs -0 sed -i -E "s/$pattern/$NIGHTLY/g"

          if git diff --quiet; then
            echo "every reference already names $NIGHTLY"
            exit 0
          fi
          git diff --stat

          git config user.name 'GitHub Actions'
          git config user.email ''
          git add -u
          git commit -m "Update recommended Roc to $NIGHTLY"
          # main may have moved since checkout, replay this one commit on top
          # rather than failing the push.
          git pull --rebase origin main
          git push

      # The published starter is a copy of examples/spa-todomvc with no nightly
      # CI of its own (people clone it as a template and should not inherit
      # our maintenance jobs), so its nightly moves from here. Only when it
      # pins the bundle this run tested: a starter that lags the latest
      # release must not get a claim proven against another bundle. The next
      # publish brings the two back in sync.
      - name: Name this nightly in the published starter
        if: github.repository == 'niclas-ahden/joy'
        env:
          NIGHTLY: ${{ needs.resolve.outputs.nightly }}
          BUNDLE: ${{ needs.resolve.outputs.bundle }}
          TOKEN: ${{ secrets.TODOMVC_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          [ -n "$TOKEN" ] || {
            echo "error: the TODOMVC_PUSH_TOKEN secret is missing. Create a fine-grained token with contents read/write on niclas-ahden/joy-todomvc and add it to this repo's secrets." >&2
            exit 1
          }

          git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/niclas-ahden/joy-todomvc" starter
          cd starter

          if ! grep -qF "platform \"$BUNDLE\"" app.roc; then
            pinned=$(sed -n 's|.*platform "\(https://[^"]*\)".*|\1|p' app.roc)
            echo "::warning::joy-todomvc pins $pinned, not the tested $BUNDLE, so it keeps its current claim"
            exit 0
          fi

          # The same rule as in this repo: every whole nightly tag in a
          # tracked file is the recommended one.
          pattern='nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}'
          files=$(git grep -lE "$pattern" -- . ':!.github' || true)
          if [ -z "$files" ]; then
            # A starter published before it named a nightly. The next
            # publish ships one that does.
            echo "::warning::no roc nightly named anywhere in the starter, nothing to update"
            exit 0
          fi

          git grep -lzE "$pattern" -- . ':!.github' | xargs -0 sed -i -E "s/$pattern/$NIGHTLY/g"
          if git diff --quiet; then
            echo "the starter already names $NIGHTLY"
            exit 0
          fi
          git diff --stat

          git config user.name 'GitHub Actions'
          git config user.email ''
          git add -u
          git commit -m "Update recommended Roc to $NIGHTLY"
          git push
          echo "the starter now recommends $NIGHTLY"

      - name: Name this nightly in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/name-nightly.sh \
            "${{ needs.resolve.outputs.joy }}" "${{ needs.resolve.outputs.nightly }}"

  # Refresh versions.json every morning, whether or not the nightly passed. A
  # green run may have named a new nightly above, and the file is written
  # from the releases, so one deleted since yesterday drops out on a red day
  # too. The notes edit above triggers nothing (see versions-index.yml).
  versions-index:
    needs: [update-recommendation]
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/versions-index.yml

  name-commit-range:
    name: Name the commit range
    needs: [resolve, test]
    # Only for a red suite. A failed `resolve` would leave every version
    # below empty.
    if: needs.test.result == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Name the commit range
        run: |
          echo "::error::Joy ${{ needs.resolve.outputs.joy }} fails on roc ${{ needs.resolve.outputs.nightly }}"
          echo "  https://github.com/roc-lang/roc/compare/${{ needs.resolve.outputs.prev_sha }}...${{ needs.resolve.outputs.sha }}"
